apiVersion: v1
kind: Secret
metadata:
  name: socialai-secrets
  namespace: socialai
type: Opaque
stringData:
  # Database Credentials
  database-url: <base64-encoded-database-connection-string>
  
  # Redis Connection
  redis-url: redis://:password@prod-redis:6379
  
  # Elasticsearch URL
  elasticsearch-url: https://prod-es:9200
  
  # Neo4j Connection
  neo4j-uri: bolt://neo4j:password@prod-neo4j:7687
  
  # JWT Secret
  jwt-secret: <base64-encoded-jwt-secret>
  
  # OpenAI API Key (if using external LLM)
  openai-api-key: <base64-encoded-openai-api-key>
