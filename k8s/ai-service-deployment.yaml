apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialai-ai-service
  namespace: socialai
  labels:
    app: socialai
    component: ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: socialai
      component: ai-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: socialai
        component: ai-service
    spec:
      containers:
      - name: ai-service
        image: socialai-ai-service:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
            name: http
        env:
          - name: NODE_ENV
            value: "production"
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: socialai-secrets
                key: database-url
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: socialai-secrets
                key: redis-url
          - name: ELASTICSEARCH_URL
            valueFrom:
              secretKeyRef:
                name: socialai-secrets
                key: elasticsearch-url
          - name: NEO4J_URI
            valueFrom:
              secretKeyRef:
                name: socialai-secrets
                key: neo4j-uri
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: socialai-secrets
                key: jwt-secret
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                name: socialai-secrets
                key: openai-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
