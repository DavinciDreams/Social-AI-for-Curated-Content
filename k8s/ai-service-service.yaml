apiVersion: v1
kind: Service
metadata:
  name: socialai-ai-service
  namespace: socialai
  labels:
    app: socialai
    component: ai-service
spec:
  type: ClusterIP
  selector:
    app: socialai
    component: ai-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  sessionAffinity: ClientIP
