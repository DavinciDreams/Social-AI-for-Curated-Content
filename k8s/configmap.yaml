apiVersion: v1
kind: ConfigMap
metadata:
  name: socialai-config
  namespace: socialai
data:
  # Backend Configuration
  API_URL: "https://api.socialai.com"
  APP_URL: "https://socialai.com"
  
  # Database Configuration
  DATABASE_HOST: "prod-db.socialai.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "socialai"
  
  # Redis Configuration
  REDIS_HOST: "prod-redis.socialai.svc.cluster.local"
  REDIS_PORT: "6379"
  
  # Elasticsearch Configuration
  ELASTICSEARCH_HOST: "prod-es.socialai.svc.cluster.local"
  ELASTICSEARCH_PORT: "9200"
  
  # Neo4j Configuration
  NEO4J_HOST: "prod-neo4j.socialai.svc.cluster.local"
  NEO4J_PORT: "7687"
  
  # Application Configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  ENABLE_ANALYTICS: "true"
